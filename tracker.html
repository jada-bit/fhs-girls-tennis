<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FHS Tennis Tracker</title>
  
  <!-- Tailwind CSS for Styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Firebase Scripts (Matching your main site version) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- React & ReactDOM (Browser Versions) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (To compile React JSX in the browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Prevent pull-to-refresh on mobile devices while tracking */
    body { overscroll-behavior-y: contain; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

  <!-- The app will render inside this div -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_STATE = {
      score: {
        A: { points: '0', games: 0, sets: 0 },
        B: { points: '0', games: 0, sets: 0 }
      },
      stats: {
        A: { totalPoints: 0, winners: 0, unforcedErrors: 0, forcedErrors: 0, aces: 0, doubleFaults: 0 },
        B: { totalPoints: 0, winners: 0, unforcedErrors: 0, forcedErrors: 0, aces: 0, doubleFaults: 0 }
      },
      server: 'A',
      log: [],
      matchWinner: null
    };

    function App() {
      // --- FIREBASE STATE ---
      const [db, setDb] = useState(null);
      const [user, setUser] = useState(null);
      const appId = 'fhs-girls-tennis'; // Your project ID from the main site

      // --- APP STATE ---
      const urlParams = new URLSearchParams(window.location.search);
      const broadcastMatchId = urlParams.get('match');

      const [view, setView] = useState(broadcastMatchId ? 'broadcast' : 'setup'); 
      const [matchId, setMatchId] = useState(broadcastMatchId || 'match-' + Math.random().toString(36).substr(2, 9));
      const [trackingDepth, setTrackingDepth] = useState('advanced');
      
      const [matchConfig, setMatchConfig] = useState({
        type: 'singles', 
        teamA: 'Freedom Varsity',
        teamB: 'Opponent High',
        playerA1: 'Player 1',
        playerA2: '',
        playerB1: 'Opponent 1',
        playerB2: '',
        format: '1-set-8'
      });

      const [history, setHistory] = useState([INITIAL_STATE]);
      const [historyIndex, setHistoryIndex] = useState(0);
      const [broadcastState, setBroadcastState] = useState(null);
      const [savedMatches, setSavedMatches] = useState([]);

      const currentState = history[historyIndex];

      // --- 1. INITIALIZE FIREBASE ---
      useEffect(() => {
        const initFirebase = async () => {
          if (!firebase.apps.length) {
            const config = {
              apiKey: "AIzaSyBtT461dmlo_8dilfxvsAo1GDv15OiOz3c",
              authDomain: "fhs-girls-tennis.firebaseapp.com",
              projectId: "fhs-girls-tennis",
              storageBucket: "fhs-girls-tennis.firebasestorage.app",
              messagingSenderId: "635997033090",
              appId: "1:635997033090:web:dbd85cd32e681f3e1d9a9b"
            };
            firebase.initializeApp(config);
          }
          
          setDb(firebase.firestore());

          try {
            await firebase.auth().signInAnonymously();
          } catch (e) {
            console.error("Firebase Auth Error:", e);
          }
        };

        initFirebase();
        
        const unsubAuth = firebase.auth().onAuthStateChanged((u) => {
          setUser(u);
        });

        return () => unsubAuth();
      }, []);

      // --- 2. LIVE SYNC: Push live points to Firestore ---
      useEffect(() => {
        if (!user || !db) return;
        if (view === 'tracking' || view === 'stats') {
          const syncData = { 
            config: matchConfig, 
            state: currentState,
            timestamp: Date.now() 
          };
          
          db.collection(`artifacts/${appId}/public/data/live_matches`).doc(matchId).set(syncData)
            .catch(err => console.error("Sync error:", err));
        }
      }, [currentState, matchConfig, view, matchId, db, user]);

      // --- 3. BROADCAST LISTENER: Pull live points from Firestore ---
      useEffect(() => {
        if (!user || !db) return;
        if (view === 'broadcast') {
          const unsub = db.collection(`artifacts/${appId}/public/data/live_matches`).doc(matchId)
            .onSnapshot(doc => {
              if (doc.exists) {
                setBroadcastState(doc.data());
              }
            }, err => console.error("Broadcast read error:", err));
            
          return () => unsub();
        }
      }, [view, matchId, db, user]);

      // --- 4. SEASON HISTORY: Load all saved matches ---
      useEffect(() => {
        if (!user || !db) return;
        const unsub = db.collection(`artifacts/${appId}/public/data/tracked_matches`)
          .onSnapshot(snap => {
            const matches = [];
            snap.forEach(doc => matches.push({ id: doc.id, ...doc.data() }));
            // Sort matches newest first (in-memory sort avoids complex query indexing rules)
            matches.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setSavedMatches(matches);
          }, err => console.error("History read error:", err));
          
        return () => unsub();
      }, [db, user]);


      // --- APP LOGIC ---
      const pushState = (newState) => {
        const newHistory = history.slice(0, historyIndex + 1);
        setHistory([...newHistory, newState]);
        setHistoryIndex(newHistory.length);
      };

      const undo = () => {
        if (historyIndex > 0) {
          setHistoryIndex(historyIndex - 1);
        }
      };

      const handlePoint = (winningTeam, statType) => {
        const losingTeam = winningTeam === 'A' ? 'B' : 'A';
        let newState = JSON.parse(JSON.stringify(currentState)); 

        // 1. Update Stats
        newState.stats[winningTeam].totalPoints += 1;
        
        if (statType === 'winner') newState.stats[winningTeam].winners += 1;
        if (statType === 'ace') newState.stats[winningTeam].aces += 1;
        if (statType === 'unforced') newState.stats[losingTeam].unforcedErrors += 1;
        if (statType === 'forced') newState.stats[losingTeam].forcedErrors += 1;
        if (statType === 'doubleFault') newState.stats[losingTeam].doubleFaults += 1;

        // Generate Log Message
        const teamName = winningTeam === 'A' ? matchConfig.teamA : matchConfig.teamB;
        const actionText = {
          'winner': 'hits a Winner!',
          'ace': 'fires an Ace!',
          'unforced': 'wins point on opponent\'s Unforced Error.',
          'forced': 'forces an Error.',
          'doubleFault': 'wins point on opponent\'s Double Fault.',
          'basic': 'wins the point.'
        }[statType];
        
        const timeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        newState.log.unshift(`[${timeString}] (${newState.score.A.points}-${newState.score.B.points}) ${teamName} ${actionText}`);

        // 2. Tennis Scoring Logic
        let pW = newState.score[winningTeam].points;
        let pL = newState.score[losingTeam].points;

        if (pW === '0') pW = '15';
        else if (pW === '15') pW = '30';
        else if (pW === '30') pW = '40';
        else if (pW === '40') {
          if (pL === '40') {
            pW = 'Ad'; // Deuce -> Ad
          } else if (pL === 'Ad') {
            pW = '40'; // Ad -> Deuce
            pL = '40';
          } else {
            // Game Won
            pW = '0';
            pL = '0';
            newState.score[winningTeam].games += 1;
            newState.server = newState.server === 'A' ? 'B' : 'A'; // Switch server
            newState.log.unshift(`🏆 ${teamName} wins the game.`);
          }
        } else if (pW === 'Ad') {
          // Game Won
          pW = '0';
          pL = '0';
          newState.score[winningTeam].games += 1;
          newState.server = newState.server === 'A' ? 'B' : 'A'; // Switch server
          newState.log.unshift(`🏆 ${teamName} wins the game.`);
        }

        newState.score[winningTeam].points = pW;
        newState.score[losingTeam].points = pL;

        // Auto Set winning logic
        const targetGames = matchConfig.format === '1-set-8' ? 8 : 6;
        const setsToWin = matchConfig.format === '1-set-8' ? 1 : 2;
        
        if (newState.score[winningTeam].games >= targetGames && (newState.score[winningTeam].games - newState.score[losingTeam].games >= 2)) {
          newState.score[winningTeam].sets += 1;
          newState.score.A.games = 0;
          newState.score.B.games = 0;
          newState.log.unshift(`🎉 ${teamName} wins the set!`);

          if (newState.score[winningTeam].sets >= setsToWin) {
            newState.matchWinner = winningTeam;
            newState.log.unshift(`🏆 ${teamName} WINS THE MATCH!`);
          }
        }

        pushState(newState);
      };

      const overrideScore = (team, type, amount) => {
        let newState = JSON.parse(JSON.stringify(currentState));
        if (type === 'games') newState.score[team].games = Math.max(0, newState.score[team].games + amount);
        if (type === 'sets') {
          newState.score[team].sets = Math.max(0, newState.score[team].sets + amount);
          const setsToWin = matchConfig.format === '1-set-8' ? 1 : 2;
          if (newState.score[team].sets >= setsToWin) {
            newState.matchWinner = team;
          } else {
            newState.matchWinner = null;
          }
        }
        newState.log.unshift(`[Manual Override] Adjusted ${matchConfig['team'+team]} ${type}.`);
        pushState(newState);
      };

      const setManualServer = (team) => {
        if (currentState.server === team) return;
        let newState = JSON.parse(JSON.stringify(currentState));
        newState.server = team;
        newState.log.unshift(`[Manual Override] Server changed to ${team === 'A' ? matchConfig.teamA : matchConfig.teamB}.`);
        pushState(newState);
      };

      const copyLiveLink = () => {
        const baseUrl = window.location.href.split('?')[0];
        const mockUrl = `${baseUrl}?match=${matchId}`;
        navigator.clipboard.writeText(mockUrl);
        alert(`Broadcast Link copied!\n\nText this to parents or post it to SportsYou to let fans follow the match live!\n\n${mockUrl}`);
      };

      // --- SAVE MATCH TO FIREBASE ---
      const saveMatch = async () => {
        if (!user || !db) return alert("Still connecting to Firebase... please try again in a few seconds.");
        
        const matchData = {
          date: new Date().toLocaleDateString(),
          config: matchConfig,
          score: currentState.score,
          stats: currentState.stats,
          winner: currentState.matchWinner,
          timestamp: Date.now()
        };
        
        try {
          await db.collection(`artifacts/${appId}/public/data/tracked_matches`).add(matchData);
          alert("Match saved to Cloud Season History!");
          setView('dashboard');
        } catch (err) {
          alert("Error saving match to cloud: " + err.message);
        }
      };

      const getPlayerAggregates = () => {
        const aggregates = {};
        savedMatches.forEach(match => {
           const p1 = match.config.playerA1;
           const p2 = match.config.playerA2;
           const isWin = match.winner === 'A';

           const addStats = (player) => {
             if (!player || player.trim() === '') return;
             if (!aggregates[player]) {
                aggregates[player] = { matches: 0, wins: 0, aces: 0, winners: 0, unforced: 0 };
             }
             aggregates[player].matches += 1;
             if (isWin) aggregates[player].wins += 1;
             
             aggregates[player].aces += match.stats.A.aces;
             aggregates[player].winners += match.stats.A.winners;
             aggregates[player].unforced += match.stats.A.unforcedErrors;
           };

           addStats(p1);
           if (match.config.type === 'doubles') addStats(p2);
        });
        
        return Object.entries(aggregates).sort((a, b) => b[1].wins - a[1].wins);
      };

      const generateInsights = (stats) => {
        let insights = [];
        
        if (stats.doubleFaults >= 3) {
          insights.push({ icon: 'ph-warning-circle text-orange-400', title: 'Serve Consistency', text: `You hit ${stats.doubleFaults} double faults. In practice, prioritize a safe, spin-heavy second serve over power to stop giving away free points.` });
        }
        if (stats.unforcedErrors > stats.winners + 3) {
          insights.push({ icon: 'ph-shield-check text-blue-400', title: 'Patience & Strategy', text: 'You have high unforced errors. Play more conservatively. Aim for the center of the court and let your opponent be the one to make the mistake.' });
        } else if (stats.winners > stats.unforcedErrors && stats.winners > 0) {
          insights.push({ icon: 'ph-fire text-orange-500', title: 'Great Aggression!', text: 'You are hitting more winners than errors! Keep dictating the play and stepping into the court.' });
        }
        if (stats.aces >= 2) {
          insights.push({ icon: 'ph-star text-yellow-400', title: 'Strong Serving', text: `Excellent job winning ${stats.aces} free points off aces.` });
        }
        if (insights.length === 0 && stats.totalPoints > 5) {
          insights.push({ icon: 'ph-check-circle text-emerald-400', title: 'Solid Baseline Play', text: 'Keep tracking to find your specific trends. Focus on consistency and moving your feet!' });
        }
        return insights;
      };

      // --- VIEWS ---

      if (view === 'setup') {
        return (
          <div className="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-4 font-sans">
            <div className="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700 relative overflow-hidden">
              {/* Cloud Connection Indicator */}
              <div className="absolute top-4 right-4 flex items-center gap-1.5 text-xs font-bold text-slate-500 bg-slate-900/50 px-2 py-1 rounded-full border border-slate-700">
                <div className={`w-2 h-2 rounded-full ${db && user ? 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]' : 'bg-red-500 animate-pulse'}`}></div>
                {db && user ? 'Cloud Ready' : 'Connecting...'}
              </div>

              <div className="flex justify-center mb-6 mt-4">
                <div className="bg-emerald-500 p-3 rounded-full shadow-lg shadow-emerald-500/30">
                  <i className="ph-fill ph-trophy text-3xl text-white"></i>
                </div>
              </div>
              <h1 className="text-2xl font-bold text-center mb-2">Freedom Tennis Tracker</h1>
              <p className="text-slate-400 text-center mb-8 text-sm">Live Match Broadcasting & Analytics</p>

              <div className="space-y-4">
                <div className="bg-slate-700/50 p-1 rounded-lg flex">
                  <button className={`flex-1 py-2 rounded-md text-sm font-medium transition-colors ${matchConfig.type === 'singles' ? 'bg-emerald-500 text-white shadow' : 'text-slate-300 hover:bg-slate-600'}`} onClick={() => setMatchConfig({...matchConfig, type: 'singles'})}>
                    <i className="ph-fill ph-user text-base inline mr-1 relative top-0.5"></i> Singles
                  </button>
                  <button className={`flex-1 py-2 rounded-md text-sm font-medium transition-colors ${matchConfig.type === 'doubles' ? 'bg-emerald-500 text-white shadow' : 'text-slate-300 hover:bg-slate-600'}`} onClick={() => setMatchConfig({...matchConfig, type: 'doubles'})}>
                    <i className="ph-fill ph-users text-base inline mr-1 relative top-0.5"></i> Doubles
                  </button>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-400 uppercase tracking-wider font-semibold">Your Team (Home)</label>
                    <input type="text" value={matchConfig.teamA} onChange={(e) => setMatchConfig({...matchConfig, teamA: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 mt-1 text-white focus:ring-2 focus:ring-emerald-500 outline-none" />
                    <input type="text" value={matchConfig.playerA1} onChange={(e) => setMatchConfig({...matchConfig, playerA1: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 mt-2 text-white text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Player 1 Name" />
                    {matchConfig.type === 'doubles' && (
                      <input type="text" value={matchConfig.playerA2} onChange={(e) => setMatchConfig({...matchConfig, playerA2: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 mt-2 text-white text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Player 2 Name" />
                    )}
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 uppercase tracking-wider font-semibold">Opponent (Away)</label>
                    <input type="text" value={matchConfig.teamB} onChange={(e) => setMatchConfig({...matchConfig, teamB: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 mt-1 text-white focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="e.g. Champe High" />
                    <input type="text" value={matchConfig.playerB1} onChange={(e) => setMatchConfig({...matchConfig, playerB1: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 mt-2 text-white text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Player 1 Name" />
                    {matchConfig.type === 'doubles' && (
                      <input type="text" value={matchConfig.playerB2} onChange={(e) => setMatchConfig({...matchConfig, playerB2: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 mt-2 text-white text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Player 2 Name" />
                    )}
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 uppercase tracking-wider font-semibold">Match Format</label>
                    <select value={matchConfig.format} onChange={(e) => setMatchConfig({...matchConfig, format: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 mt-1 text-white focus:ring-2 focus:ring-emerald-500 outline-none appearance-none">
                      <option value="1-set-8">1 Pro Set (to 8, win by 2)</option>
                      <option value="2-sets-6">2 Sets (to 6, win by 2)</option>
                    </select>
                  </div>
                </div>

                <button onClick={() => setView('tracking')} className="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-3 rounded-lg mt-6 shadow-lg shadow-emerald-500/20 transition-all flex justify-center items-center">
                  Start Live Tracking <i className="ph-bold ph-activity text-xl ml-2"></i>
                </button>

                <button onClick={() => setView('dashboard')} className="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg mt-3 transition-all flex justify-center items-center">
                  Cloud Season History <i className="ph-bold ph-cloud-arrow-up text-xl ml-2"></i>
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (view === 'broadcast') {
        if (!broadcastState) {
          return (
            <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-6 text-center text-slate-100">
              <i className="ph ph-broadcast text-6xl text-slate-600 mb-4 animate-pulse"></i>
              <h2 className="text-xl font-bold text-slate-300">Awaiting Broadcast Data...</h2>
              <p className="text-slate-500 mt-2">Connecting to Firebase Cloud. Once the coach logs the first point, the scoreboard will appear here automatically.</p>
            </div>
          );
        }

        const bState = broadcastState.state;
        const bConfig = broadcastState.config;
        const teamAInsights = generateInsights(bState.stats.A);

        return (
          <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans">
            <header className="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center sticky top-0 z-10 shadow-lg">
              <div className="flex items-center gap-2">
                <i className="ph-fill ph-broadcast text-red-500 animate-pulse text-2xl"></i>
                <div>
                  <h2 className="font-bold text-sm text-white leading-tight">Live Match Broadcast</h2>
                  <p className="text-[10px] text-slate-400 uppercase tracking-widest">{bConfig.type} • {bConfig.format === '1-set-8' ? 'Pro Set' : '2 Sets'}</p>
                </div>
              </div>
            </header>

            <div className="p-4 max-w-xl mx-auto w-full space-y-4">
              {/* Scoreboard block */}
              <div className="bg-slate-800 rounded-2xl border border-slate-700 shadow-xl overflow-hidden">
                <div className="grid grid-cols-[1fr_auto_auto_auto] bg-slate-900/80 p-3 text-xs font-semibold text-slate-400 border-b border-slate-700">
                  <div>Team / Player</div>
                  <div className="w-10 text-center">S</div>
                  <div className="w-10 text-center">G</div>
                  <div className="w-16 text-center text-emerald-400">PTS</div>
                </div>

                <div className={`grid grid-cols-[1fr_auto_auto_auto] p-4 border-b border-slate-700 items-center ${bState.server === 'A' ? 'bg-slate-700/20' : ''}`}>
                  <div className="flex items-center gap-2">
                    <div className={`w-2 h-2 rounded-full ${bState.server === 'A' ? 'bg-yellow-400 shadow-[0_0_8px_rgba(250,204,21,0.6)]' : 'bg-transparent'}`}></div>
                    <div>
                      <div className="font-bold text-base">{bConfig.teamA}</div>
                      <div className="text-xs text-slate-400 mt-0.5">{bConfig.playerA1} {bConfig.type === 'doubles' && `& ${bConfig.playerA2}`}</div>
                    </div>
                  </div>
                  <div className="w-10 text-center text-xl font-bold">{bState.score.A.sets}</div>
                  <div className="w-10 text-center text-xl font-bold">{bState.score.A.games}</div>
                  <div className="w-16 text-center text-3xl font-black text-emerald-400 tracking-tighter">{bState.score.A.points}</div>
                </div>

                <div className={`grid grid-cols-[1fr_auto_auto_auto] p-4 items-center ${bState.server === 'B' ? 'bg-slate-700/20' : ''}`}>
                  <div className="flex items-center gap-2">
                    <div className={`w-2 h-2 rounded-full ${bState.server === 'B' ? 'bg-yellow-400 shadow-[0_0_8px_rgba(250,204,21,0.6)]' : 'bg-transparent'}`}></div>
                    <div>
                      <div className="font-bold text-base">{bConfig.teamB}</div>
                      <div className="text-xs text-slate-400 mt-0.5">{bConfig.playerB1} {bConfig.type === 'doubles' && `& ${bConfig.playerB2}`}</div>
                    </div>
                  </div>
                  <div className="w-10 text-center text-xl font-bold">{bState.score.B.sets}</div>
                  <div className="w-10 text-center text-xl font-bold">{bState.score.B.games}</div>
                  <div className="w-16 text-center text-3xl font-black text-emerald-400 tracking-tighter">{bState.score.B.points}</div>
                </div>
              </div>

              {bState.matchWinner && (
                 <div className="bg-emerald-900/40 border border-emerald-500/50 p-4 rounded-xl text-center">
                   <h3 className="text-xl font-black text-emerald-400">Match Complete</h3>
                   <p className="text-slate-300 font-bold">{bState.matchWinner === 'A' ? bConfig.teamA : bConfig.teamB} wins.</p>
                 </div>
              )}

              {/* Play by Play log */}
              <div className="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden flex flex-col h-64">
                <div className="bg-slate-900 p-2 text-xs font-bold text-slate-400 text-center uppercase tracking-widest border-b border-slate-700">Play-by-Play Live Feed</div>
                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                  {bState.log.map((entry, i) => (
                    <div key={i} className={`text-sm ${i === 0 ? 'text-white font-bold' : 'text-slate-400'}`}>

                  let colorB = 'bg-slate-600';
                  
                  if (stat.invertColors) {

                    else if (valB > valA) { colorA = 'bg-emerald-500'; colorB = 'bg-red-500'; }
                    else { colorA = 'bg-slate-500'; colorB = 'bg-slate-500'; }

              <i className="ph-bold ph-arrow-counter-clockwise text-xl"></i>
            </button>
            
            <div className="flex-1 bg-slate-900 rounded-xl p-2 h-12 overflow-hidden border border-slate-700 relative flex items-center pl-8">
              <i className="ph-fill ph-chat-circle text-base text-slate-500 absolute left-2"></i>
              {currentState.log.length > 0 ? (
                <div className="text-xs sm:text-sm text-slate-300 truncate">{currentState.log[0]}</div>
              ) : (
                <div className="text-xs text-slate-500 italic">Match started. Awaiting first point...</div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
